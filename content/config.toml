# ============================================================
# 全站配置 —— 最常改的就是这个文件
# 改完保存，浏览器会自动刷新（npm run dev 运行中时）
# ============================================================

[site]
# 网站标题：显示在浏览器标签页和导航栏左上角
title = "Saisai Yin"
# 网站简介：搜索引擎和分享卡片上显示的描述
description = "Personal site of Saisai Yin — hydrology, landslide modelling, and the tools I build."
# 标签页小图标，文件放在 public/ 目录下
favicon = "/favicon.svg"
# 页脚显示的最后更新日期
last_updated = "October 2026"

[author]
name = "Saisai Yin"
# 你的身份 / 年级，例如 "PhD Student" / "MSc Student"
title = "MSE Student in Hydrology"
institution = "Hohai University"
# 头像图片，放在 public/ 目录下（建议 600x600 以上的正方形）
avatar = "/photo.jpg"

[social]
# 联系方式：留空或整行删掉，前端就不显示对应的图标
email = "saisai.yin@foxmail.com"
location = "Nanjing, China"
location_url = "https://www.google.com/maps/place/Nanjing"
location_details = [
  "Hohai University,",
  "1 Xikang Road, Nanjing, China"
]
# 没有的账号就直接删掉那一行
google_scholar = ""
orcid = ""
github = "https://github.com/hydro-sai"
linkedin = ""

# ---- 中国常用平台（留空 "" 就自动隐藏图标）----
# 图标显示顺序由 src/components/home/Profile.tsx 里的 socialLinks 数组决定
# B站个人空间：直接复制浏览器地址栏，形如 https://space.bilibili.com/1234567
bilibili = ""
# CSDN 博客主页：https://blog.csdn.net/你的用户名
csdn = ""
# 微信没有公开的个人主页。建议放一张微信二维码图片：
#   1) 二维码图片存成 public/wechat-qr.png
#   2) 这里填 "/wechat-qr.png"
#   3) 点图标会打开这张图（浏览器直接显示图片，可长按保存后扫码）
# 也可以填公众号文章链接，例如 https://mp.weixin.qq.com/s/xxxxx
wechat = ""

[features]
# 首页 "About" 卡片上的点赞按钮
enable_likes = true

# 是否把所有子页面拼成一页长滚动（false = 每个页面独立）
enable_one_page_mode = false

# ------------------------------------------------------------
# 多语言：content/ 是英文，content_zh/ 是中文
# 只想维护一种语言？把 enabled 改成 false 即可
# ------------------------------------------------------------
[i18n]
enabled = true
locales = ["zh", "en"]
# 默认语言：中文访客默认看到中文
default_locale = "zh"
# "auto" = 跟随浏览器语言， "fixed" = 永远用 default_locale
mode = "auto"
fixed_locale = "zh"
persist = true
switcher = true

[i18n.labels]
zh = "中文"
en = "English"

# ------------------------------------------------------------
# 顶部导航栏：顺序 = 显示顺序
# target 必须和 content/ 下的文件名一致（去掉 .toml）
# 想加新页面：复制一份 research.toml 改名，再在这里加一段
# ------------------------------------------------------------

[[navigation]]
title = "About"
type = "page"
target = "about"
href = "/"

[[navigation]]
title = "Research"
type = "page"
target = "research"
href = "/research"

[[navigation]]
title = "Publications"
type = "page"
target = "publications"
href = "/publications"

[[navigation]]
title = "Projects"
type = "page"
target = "projects"
href = "/projects"

[[navigation]]
title = "CV"
type = "page"
target = "cv"
href = "/cv"
