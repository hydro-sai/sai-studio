# ============================================================
# 中文版全站配置（content/ 是英文版，改哪个语言就改哪个目录）
# ============================================================

[site]
title = "尹赛赛"
description = "赛的个人主页 —— 水文、滑坡数值模拟，以及我自己写的小工具。"
# 标签页小图标（浏览器会长期缓存它，所以带了 ?v=2 这个版本号）
# 改完图标图案后如果浏览器不刷新，把 ?v=2 改成 ?v=3、?v=4 即可强制更新
favicon = "/favicon.svg?v=2"
# 页脚现在显示的是「© 年份 姓名」，不再读取这一项，留着备用
last_updated = "2026 年 10 月"

[author]
name = "尹赛赛"
title = "水文学及水资源 研究生"
institution = "河海大学"
avatar = "/photo.jpg"

[social]
email = "saisai.yin@foxmail.com"
location = "中国 · 南京"
location_url = "https://www.google.com/maps/place/Nanjing"
location_details = [
  "河海大学，",
  "江苏省南京市西康路 1 号"
]
google_scholar = ""
orcid = ""
github = "https://github.com/hydro-sai"
linkedin = ""

# ---------- 中国常用平台 ----------
# 规则：填了值就显示图标，留空 "" 就自动隐藏。三种都支持。
# 图标显示顺序在 src/components/home/Profile.tsx 的 socialLinks 数组里，想调顺序改那里。

# B站（哔哩哔哩）个人空间
# 打开你的 B 站主页，直接复制地址栏，形如：https://space.bilibili.com/1234567
bilibili = "https://space.bilibili.com/511390777"

# CSDN 博客主页
# 形如：https://blog.csdn.net/你的用户名
csdn = "https://blog.csdn.net/m0_72915016"

# 微信
# 微信没有公开的个人主页，这里有两种填法：
#   填法一（推荐）：把微信二维码图片存成 public/wechat-qr.png，这里写 "/wechat-qr.png"
#                  → 点图标会直接打开这张二维码图，别人长按/右键保存后微信扫一扫即可
#   填法二：填公众号某篇文章的链接，形如 "https://mp.weixin.qq.com/s/xxxxxxxx"
wechat = "wechat-qr.png"

[features]
enable_likes = true
enable_one_page_mode = false

[i18n]
enabled = true
locales = ["zh", "en"]
default_locale = "zh"
mode = "auto"
fixed_locale = "zh"
persist = true
switcher = true

[i18n.labels]
zh = "中文"
en = "English"

[[navigation]]
title = "关于"
type = "page"
target = "about"
href = "/"

[[navigation]]
title = "研究"
