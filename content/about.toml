type = "about"
title = "About"

# 首页左侧的三个研究兴趣标签，随便加减
[profile]
research_interests = [
  "Hydrology–Landslide Coupling",
  "Landslide Numerical Modelling",
  "Open-source Scientific Software"
]

# 首页从上到下依次渲染这几个 section，可以调顺序、删掉不想要的

[[sections]]
id = "about"
type = "markdown"
source = "bio.md"
title = "About"

[[sections]]
id = "featured_publications"
type = "publications"
title = "Selected Publications"
# selected = 只显示 bib 里标了 selected={true} 的条目
filter = "selected"
limit = 3

[[sections]]
id = "news"
type = "list"
title = "News"
source = "news.toml"
