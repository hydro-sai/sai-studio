[[items]]
title = "青海省省级科技计划（2024-SF-A1）"
subtitle = "国家气象局科研项目"
date = "2025.06 – 至今"
link = "https://github.com/hydro-sai/Qinghai-task"
content = """
结合青海省中小河流短历时洪水突发性强、监测站点稀疏的实际防灾需求，目前已在青海省气象局完成中小流域洪水预报预警模型的部署，并通过多轮运行调试验证了模型稳定性与计算精度。

**我负责：** 汛期洪水及滑坡灾害的模拟及预警、撰写项目的中期和结项验收报告、建立1km分辨率的水文-滑坡耦合模型（iHydroSlide）、进行青海省中小流域的降雨型洪水及滑坡灾害风险分析。
"""
tags = ["灾害预警", "1km分辨率模型", "报告撰写"]

[[items]]
title = "全国洪水及山洪、滑坡灾害年度检验"
subtitle = "国家气象局科研项目"
date = "2024.09 – 2024.10"
link = "https://github.com/hydro-sai/China-task"
content = """
应用水文-滑坡耦合模型对全国尺度下洪水及山洪、滑坡灾害进行模拟，评估年度防灾成效，优化防控方案。完善全国灾害防控体系，提升跨区域预警精准度与协同处置能力，为政策制定提供依据。

**我负责：** 全国洪水及山洪、滑坡灾害模拟、基于 iHydroSlide 模型调试修正数据与区域参数、开展模型结果检验评估、绘制 ROC 曲线并计算 AUC、灾害命中率。

**发表EI期刊1篇**
"""
tags = ["全国灾害评估", "模型检验", "报告撰写"]

[[items]]
title = "长江流域片水资源供需平衡分析"
subtitle = "长江勘测规划设计研究院科研项目"
date = "2023.11 – 2023.12"
link = "https://space.bilibili.com/511390777/lists/2013894"
content = """
结合长江流域片水资源时空分布不均、局部供需矛盾突出的水资源管控实际需求，开展流域多情景水资源供需平衡模拟分析，并通过分区核算与方案对比识别了流域缺水区域及供需短板。

**我负责：** 承担长江流域片供需资料收集校核、分区供需核算与多情景模拟分析，开展可供水量、需水预测及缺水格局识别，撰写专题内容，配合成果修改、图件整理与报告汇总归档。

**取得作品著作权3项**
"""
tags = ["长江流域片","水资源供需平衡", "需水预测", "缺水格局"]

[[items]]
title = "甘肃矿区老取水口至矿区水管线暴雨洪水研究"
subtitle = "中国水利水电科学研究院科研项目"
date = "2022.06 – 2022.12"
link = "https://space.bilibili.com/511390777/lists/2497473?type=series"
content = """
结合甘肃矿区老取水口至矿区输水管线沿线山洪风险突出、沿线小流域基础地貌资料匮乏的防洪分析需求，开展管线沿线小流域水文地貌参数提取与特征值计算，并通过流域划分与河长、比降核算为管线暴雨洪水推求提供基础支撑。

**我负责：** 甘肃矿区管线沿线小流域划分、基于 DEM 提取 86 个小流域，计算各流域干流河长与河道比降，为管线暴雨洪水计算提供地貌基础参数。

**取得作品著作权1项**
"""
tags = ["小流域提取","河道比降", "河长计算", "DEM 水文分析"]

